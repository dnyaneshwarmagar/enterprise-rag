name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 815398003681.dkr.ecr.us-east-1.amazonaws.com
  ECR_APP_REPO: enterprise-rag
  ECR_EVALS_REPO: enterprise-rag-evals
  # Reuse app ECR repo tags (no CreateRepository IAM needed).
  LITELLM_ECR_TAG: litellm-main
  LITELLM_SOURCE_IMAGE: ghcr.io/berriai/litellm:main-stable

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      evals_image: ${{ steps.meta.outputs.evals_image }}
      litellm_image: ${{ steps.meta.outputs.litellm_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::815398003681:role/enterprise-rag-github
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image names
        id: meta
        run: |
          set -eu
          image="${{ env.ECR_REGISTRY }}/${{ env.ECR_APP_REPO }}"
          evals_image="${{ env.ECR_REGISTRY }}/${{ env.ECR_EVALS_REPO }}"
          litellm_image="${image}:${{ env.LITELLM_ECR_TAG }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "evals_image=${evals_image}" >> "$GITHUB_OUTPUT"
          echo "litellm_image=${litellm_image}" >> "$GITHUB_OUTPUT"
          echo "Pushing ${image}, ${evals_image}, LiteLLM→${litellm_image}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mirror LiteLLM image into ECR
        run: |
          set -eu
          src="${{ env.LITELLM_SOURCE_IMAGE }}"
          dst="${{ steps.meta.outputs.litellm_image }}"
          docker pull "$src"
          docker tag "$src" "$dst"
          docker push "$dst"

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push evals image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.evals
          push: true
          tags: |
            ${{ steps.meta.outputs.evals_image }}:main
            ${{ steps.meta.outputs.evals_image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=evals
          cache-to: type=gha,mode=max,scope=evals

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::815398003681:role/enterprise-rag-github
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull images on EC2 and restart Compose
        env:
          IMAGE: ${{ needs.publish.outputs.image }}:${{ github.sha }}
          EVALS_IMAGE: ${{ needs.publish.outputs.evals_image }}:${{ github.sha }}
          LITELLM_IMAGE: ${{ needs.publish.outputs.litellm_image }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_FALLBACK_API_KEY: ${{ secrets.GROQ_FALLBACK_API_KEY }}
          JUDGE_GROQ_API_KEY: ${{ secrets.JUDGE_GROQ_API_KEY }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
        run: |
          set -eu
          image_q=$(printf '%q' "$IMAGE")
          evals_q=$(printf '%q' "$EVALS_IMAGE")
          litellm_q=$(printf '%q' "$LITELLM_IMAGE")
          groq_q=$(printf '%q' "${GROQ_API_KEY:-}")
          groq_fb_q=$(printf '%q' "${GROQ_FALLBACK_API_KEY:-}")
          judge_q=$(printf '%q' "${JUDGE_GROQ_API_KEY:-}")
          master_q=$(printf '%q' "${LITELLM_MASTER_KEY:-sk-litellm-local}")
          cat > /tmp/ssm.json <<EOF
          {"commands":["sudo -u ubuntu env ENTERPRISE_RAG_IMAGE=${image_q} ENTERPRISE_RAG_EVALS_IMAGE=${evals_q} LITELLM_IMAGE=${litellm_q} GROQ_API_KEY=${groq_q} GROQ_FALLBACK_API_KEY=${groq_fb_q} JUDGE_GROQ_API_KEY=${judge_q} LITELLM_MASTER_KEY=${master_q} LLM_GATEWAY=litellm LITELLM_BASE_URL=http://litellm:4000 bash /opt/enterprise-rag/deploy/remote-update.sh"]}
          EOF
          command_id=$(aws ssm send-command \
            --instance-ids i-07a586aa1312f97c3 \
            --document-name AWS-RunShellScript \
            --timeout-seconds 1200 \
            --comment "deploy main (ECR compose pull)" \
            --parameters file:///tmp/ssm.json \
            --query Command.CommandId --output text)
          echo "command=$command_id image=$IMAGE evals=$EVALS_IMAGE litellm=$LITELLM_IMAGE"
          for _ in $(seq 1 80); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id i-07a586aa1312f97c3 \
              --query Status --output text || true)
            echo "status=$status"
            case "$status" in
              Success) exit 0 ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id i-07a586aa1312f97c3 \
                  --query StandardErrorContent --output text || true
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id i-07a586aa1312f97c3 \
                  --query StandardOutputContent --output text || true
                exit 1
                ;;
            esac
            sleep 15
          done
          exit 1

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::815398003681:role/enterprise-rag-github
          aws-region: ${{ env.AWS_REGION }}

      - name: Single /query smoke (SSM on EC2)
        env:
          RAG_API_KEY: ${{ secrets.RAG_API_KEY }}
        run: |
          set -eu
          # Health wait + one live /query only (no golden/RAGAS eval).
          auth_hdr=""
          if [ -n "${RAG_API_KEY:-}" ]; then
            auth_hdr="-H \"Authorization: Bearer ${RAG_API_KEY}\""
          fi
          cat > /tmp/ssm-smoke.json <<EOF
          {"commands":["set -eu","for i in \$(seq 1 36); do curl -fsS --max-time 10 http://127.0.0.1/api/health | grep -q ok && break; echo waiting_\$i; sleep 5; done","curl -fsS --max-time 10 http://127.0.0.1/api/health","resp=\$(curl -fsS --max-time 180 -H 'Content-Type: application/json' ${auth_hdr} -d '{\"q\":\"What kubectl command lists Kubernetes Jobs?\",\"thread_id\":\"cd-smoke\"}' http://127.0.0.1/api/query)","echo \"\$resp\" | head -c 500","echo \"\$resp\" | grep -q '\"answer\"'","echo \"\$resp\" | grep -vq '\"answer\": \"\"'","echo SMOKE_OK"]}
          EOF
          command_id=$(aws ssm send-command \
            --instance-ids i-07a586aa1312f97c3 \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --comment "post-deploy groq /query smoke" \
            --parameters file:///tmp/ssm-smoke.json \
            --query Command.CommandId --output text)
          echo "command=$command_id"
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id i-07a586aa1312f97c3 \
              --query Status --output text || true)
            echo "status=$status"
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id i-07a586aa1312f97c3 \
                  --query StandardOutputContent --output text
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id i-07a586aa1312f97c3 \
                  --query StandardErrorContent --output text || true
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id i-07a586aa1312f97c3 \
                  --query StandardOutputContent --output text || true
                exit 1
                ;;
            esac
            sleep 10
          done
          exit 1
