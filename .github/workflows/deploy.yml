name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 815398003681.dkr.ecr.us-east-1.amazonaws.com
  ECR_APP_REPO: enterprise-rag
  ECR_EVALS_REPO: enterprise-rag-evals

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      evals_image: ${{ steps.meta.outputs.evals_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::815398003681:role/enterprise-rag-github
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image names
        id: meta
        run: |
          set -eu
          image="${{ env.ECR_REGISTRY }}/${{ env.ECR_APP_REPO }}"
          evals_image="${{ env.ECR_REGISTRY }}/${{ env.ECR_EVALS_REPO }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "evals_image=${evals_image}" >> "$GITHUB_OUTPUT"
          echo "Pushing ${image} and ${evals_image} (:main + :${{ github.sha }})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push evals image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.evals
          push: true
          tags: |
            ${{ steps.meta.outputs.evals_image }}:main
            ${{ steps.meta.outputs.evals_image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=evals
          cache-to: type=gha,mode=max,scope=evals

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::815398003681:role/enterprise-rag-github
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull images on EC2 and restart Compose
        env:
          IMAGE: ${{ needs.publish.outputs.image }}:${{ github.sha }}
          EVALS_IMAGE: ${{ needs.publish.outputs.evals_image }}:${{ github.sha }}
        run: |
          set -eu
          image_q=$(printf '%q' "$IMAGE")
          evals_q=$(printf '%q' "$EVALS_IMAGE")
          cat > /tmp/ssm.json <<EOF
          {"commands":["sudo -u ubuntu env ENTERPRISE_RAG_IMAGE=${image_q} ENTERPRISE_RAG_EVALS_IMAGE=${evals_q} bash /opt/enterprise-rag/deploy/remote-update.sh"]}
          EOF
          command_id=$(aws ssm send-command \
            --instance-ids i-07a586aa1312f97c3 \
            --document-name AWS-RunShellScript \
            --timeout-seconds 1200 \
            --comment "deploy main (ECR compose pull)" \
            --parameters file:///tmp/ssm.json \
            --query Command.CommandId --output text)
          echo "command=$command_id image=$IMAGE evals=$EVALS_IMAGE"
          for _ in $(seq 1 80); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id i-07a586aa1312f97c3 \
              --query Status --output text || true)
            echo "status=$status"
            case "$status" in
              Success) exit 0 ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id i-07a586aa1312f97c3 \
                  --query StandardErrorContent --output text || true
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id i-07a586aa1312f97c3 \
                  --query StandardOutputContent --output text || true
                exit 1
                ;;
            esac
            sleep 15
          done
          exit 1

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::815398003681:role/enterprise-rag-github
          aws-region: ${{ env.AWS_REGION }}

      - name: Live /query smoke via Groq (LiteLLM on EC2)
        env:
          SMOKE_TIMEOUT_S: "180"
          SMOKE_QUESTION: "What kubectl command lists Kubernetes Jobs?"
          RAG_API_KEY: ${{ secrets.RAG_API_KEY }}
        run: |
          set -eu
          if [ -n "${{ secrets.SMOKE_BASE_URL }}" ]; then
            base="${{ secrets.SMOKE_BASE_URL }}"
          else
            ip=$(aws ec2 describe-instances \
              --instance-ids i-07a586aa1312f97c3 \
              --query 'Reservations[0].Instances[0].PublicIpAddress' \
              --output text)
            test -n "$ip" && test "$ip" != "None"
            base="http://${ip}/api"
          fi
          echo "SMOKE_BASE_URL=${base}"
          export SMOKE_BASE_URL="$base"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "${base}/health" | grep -q ok; then
              break
            fi
            echo "waiting for health ($i)..."
            sleep 10
          done
          chmod +x deploy/smoke_groq_query.sh
          bash deploy/smoke_groq_query.sh
