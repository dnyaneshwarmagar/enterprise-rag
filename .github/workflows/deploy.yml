name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 815398003681.dkr.ecr.us-east-1.amazonaws.com
  ECR_APP_REPO: enterprise-rag
  ECR_EVALS_REPO: enterprise-rag-evals
  # Reuse app ECR repo tags (no CreateRepository IAM needed).
  LITELLM_ECR_TAG: litellm-main
  LITELLM_SOURCE_IMAGE: ghcr.io/berriai/litellm:main-stable

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      evals_image: ${{ steps.meta.outputs.evals_image }}
      litellm_image: ${{ steps.meta.outputs.litellm_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::815398003681:role/enterprise-rag-github
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image names
        id: meta
        run: |
          set -eu
          image="${{ env.ECR_REGISTRY }}/${{ env.ECR_APP_REPO }}"
          evals_image="${{ env.ECR_REGISTRY }}/${{ env.ECR_EVALS_REPO }}"
          litellm_image="${image}:${{ env.LITELLM_ECR_TAG }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "evals_image=${evals_image}" >> "$GITHUB_OUTPUT"
          echo "litellm_image=${litellm_image}" >> "$GITHUB_OUTPUT"
          echo "Pushing ${image}, ${evals_image}, LiteLLM→${litellm_image}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mirror LiteLLM image into ECR
        run: |
          set -eu
          src="${{ env.LITELLM_SOURCE_IMAGE }}"
          dst="${{ steps.meta.outputs.litellm_image }}"
          docker pull "$src"
          docker tag "$src" "$dst"
          docker push "$dst"

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Only :main — SHA tags keep every build billed in ECR Free Tier.
          tags: |
            ${{ steps.meta.outputs.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push evals image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.evals
          push: true
          tags: |
            ${{ steps.meta.outputs.evals_image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=evals
          cache-to: type=gha,mode=max,scope=evals

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::815398003681:role/enterprise-rag-github
          aws-region: ${{ env.AWS_REGION }}

      - name: Kick off EC2 deploy (async SSM) and wait for ok
        env:
          IMAGE: ${{ needs.publish.outputs.image }}:main
          EVALS_IMAGE: ${{ needs.publish.outputs.evals_image }}:main
          LITELLM_IMAGE: ${{ needs.publish.outputs.litellm_image }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_FALLBACK_API_KEY: ${{ secrets.GROQ_FALLBACK_API_KEY }}
          JUDGE_GROQ_API_KEY: ${{ secrets.JUDGE_GROQ_API_KEY }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          EC2_INSTANCE_ID: i-07a586aa1312f97c3
        run: |
          set -eu
          image_q=$(printf '%q' "$IMAGE")
          evals_q=$(printf '%q' "$EVALS_IMAGE")
          litellm_q=$(printf '%q' "$LITELLM_IMAGE")
          groq_q=$(printf '%q' "${GROQ_API_KEY:-}")
          groq_fb_q=$(printf '%q' "${GROQ_FALLBACK_API_KEY:-}")
          judge_q=$(printf '%q' "${JUDGE_GROQ_API_KEY:-}")
          master_q=$(printf '%q' "${LITELLM_MASTER_KEY:-sk-litellm-local}")

          # Short SSM: git sync + nohup remote-update (avoids ipc timeout on t3.micro).
          cat > /tmp/ssm-kickoff.json <<EOF
          {"commands":["sudo -u ubuntu env ENTERPRISE_RAG_IMAGE=${image_q} ENTERPRISE_RAG_EVALS_IMAGE=${evals_q} LITELLM_IMAGE=${litellm_q} GROQ_API_KEY=${groq_q} GROQ_FALLBACK_API_KEY=${groq_fb_q} JUDGE_GROQ_API_KEY=${judge_q} LITELLM_MASTER_KEY=${master_q} LLM_GATEWAY=litellm LITELLM_BASE_URL=http://litellm:4000 bash -lc 'set -euo pipefail; cd /opt/enterprise-rag; export GIT_SSH_COMMAND=\"ssh -i /home/ubuntu/.ssh/github_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes\"; git fetch origin main; git reset --hard origin/main; bash deploy/ssm-deploy-kickoff.sh'"]}
          EOF

          wait_ssm() {
            local command_id="$1"
            local max_loops="${2:-40}"
            local sleep_s="${3:-5}"
            local i status
            for i in $(seq 1 "$max_loops"); do
              status=$(aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query Status --output text 2>/dev/null || true)
              echo "ssm_status=$status"
              case "$status" in
                Success)
                  aws ssm get-command-invocation \
                    --command-id "$command_id" \
                    --instance-id "$EC2_INSTANCE_ID" \
                    --query StandardOutputContent --output text || true
                  return 0
                  ;;
                Failed|TimedOut|Cancelled|Cancelling)
                  aws ssm get-command-invocation \
                    --command-id "$command_id" \
                    --instance-id "$EC2_INSTANCE_ID" \
                    --query StandardErrorContent --output text || true
                  aws ssm get-command-invocation \
                    --command-id "$command_id" \
                    --instance-id "$EC2_INSTANCE_ID" \
                    --query StandardOutputContent --output text || true
                  return 1
                  ;;
              esac
              sleep "$sleep_s"
            done
            return 1
          }

          kickoff_ok=0
          for attempt in 1 2 3; do
            echo "kickoff attempt=$attempt image=$IMAGE"
            command_id=$(aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --timeout-seconds 180 \
              --comment "async deploy kickoff (attempt $attempt)" \
              --parameters file:///tmp/ssm-kickoff.json \
              --query Command.CommandId --output text)
            echo "kickoff_command=$command_id"
            if wait_ssm "$command_id" 36 5; then
              kickoff_ok=1
              break
            fi
            echo "kickoff attempt=$attempt failed; retrying..."
            sleep 10
          done
          if [ "$kickoff_ok" != 1 ]; then
            echo "kickoff failed after retries"
            exit 1
          fi

          # Poll deploy status file with short SSM commands.
          cat > /tmp/ssm-poll.json <<'EOF'
          {"commands":["cat /tmp/enterprise-rag-deploy.status 2>/dev/null || echo missing"]}
          EOF
          for _ in $(seq 1 80); do
            poll_id=$(aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --timeout-seconds 60 \
              --comment "poll enterprise-rag deploy status" \
              --parameters file:///tmp/ssm-poll.json \
              --query Command.CommandId --output text)
            deploy_state=""
            for __ in $(seq 1 24); do
              pstatus=$(aws ssm get-command-invocation \
                --command-id "$poll_id" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query Status --output text 2>/dev/null || true)
              case "$pstatus" in
                Success)
                  deploy_state=$(aws ssm get-command-invocation \
                    --command-id "$poll_id" \
                    --instance-id "$EC2_INSTANCE_ID" \
                    --query StandardOutputContent --output text | tr -d '\r' | head -n1 | tr -d '[:space:]')
                  break
                  ;;
                Failed|TimedOut|Cancelled|Cancelling)
                  deploy_state="poll_failed"
                  break
                  ;;
              esac
              sleep 2
            done
            echo "deploy_state=$deploy_state"
            case "$deploy_state" in
              ok) exit 0 ;;
              failed)
                echo "--- deploy log (tail) ---"
                cat > /tmp/ssm-log.json <<'EOF'
          {"commands":["tail -n 120 /tmp/enterprise-rag-deploy.log 2>/dev/null || true"]}
          EOF
                log_id=$(aws ssm send-command \
                  --instance-ids "$EC2_INSTANCE_ID" \
                  --document-name AWS-RunShellScript \
                  --timeout-seconds 60 \
                  --parameters file:///tmp/ssm-log.json \
                  --query Command.CommandId --output text)
                sleep 8
                aws ssm get-command-invocation \
                  --command-id "$log_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query StandardOutputContent --output text || true
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "timed out waiting for deploy status=ok"
          exit 1

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::815398003681:role/enterprise-rag-github
          aws-region: ${{ env.AWS_REGION }}

      - name: Single /query smoke (SSM on EC2)
        env:
          RAG_API_KEY: ${{ secrets.RAG_API_KEY }}
          EC2_INSTANCE_ID: i-07a586aa1312f97c3
        run: |
          set -eu
          # Health wait + one live /query only (no golden/RAGAS eval).
          auth_hdr=""
          if [ -n "${RAG_API_KEY:-}" ]; then
            auth_hdr="-H \"Authorization: Bearer ${RAG_API_KEY}\""
          fi
          cat > /tmp/ssm-smoke.json <<EOF
          {"commands":["set -eu","for i in \$(seq 1 48); do api=0; llm=0; curl -fsS --max-time 10 http://127.0.0.1/api/health 2>/dev/null | grep -q ok && api=1; curl -fsS --max-time 10 http://127.0.0.1:4000/health/liveliness >/dev/null 2>&1 && llm=1; [ \"\$api\" = 1 ] && [ \"\$llm\" = 1 ] && break; echo waiting_\$i api=\$api litellm=\$llm; sleep 5; done","curl -fsS --max-time 10 http://127.0.0.1/api/health","curl -fsS --max-time 10 http://127.0.0.1:4000/health/liveliness","resp=\"\"; for j in \$(seq 1 5); do resp=\$(curl -fsS --max-time 180 -H 'Content-Type: application/json' ${auth_hdr} -d '{\"q\":\"What kubectl command lists Kubernetes Jobs?\",\"thread_id\":\"cd-smoke\"}' http://127.0.0.1/api/query) && break; echo query_retry_\$j; sleep 15; done","echo \"\$resp\" | head -c 500","echo \"\$resp\" | grep -q '\"answer\"'","echo \"\$resp\" | grep -vq '\"answer\": \"\"'","echo SMOKE_OK"]}
          EOF

          for attempt in 1 2 3; do
            echo "smoke attempt=$attempt"
            command_id=$(aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --timeout-seconds 600 \
              --comment "post-deploy groq /query smoke (attempt $attempt)" \
              --parameters file:///tmp/ssm-smoke.json \
              --query Command.CommandId --output text)
            echo "command=$command_id"
            for _ in $(seq 1 60); do
              status=$(aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query Status --output text || true)
              echo "status=$status"
              case "$status" in
                Success)
                  aws ssm get-command-invocation \
                    --command-id "$command_id" \
                    --instance-id "$EC2_INSTANCE_ID" \
                    --query StandardOutputContent --output text
                  exit 0
                  ;;
                Failed|TimedOut|Cancelled|Cancelling)
                  aws ssm get-command-invocation \
                    --command-id "$command_id" \
                    --instance-id "$EC2_INSTANCE_ID" \
                    --query StandardErrorContent --output text || true
                  aws ssm get-command-invocation \
                    --command-id "$command_id" \
                    --instance-id "$EC2_INSTANCE_ID" \
                    --query StandardOutputContent --output text || true
                  break
                  ;;
              esac
              sleep 10
            done
            sleep 10
          done
          exit 1
