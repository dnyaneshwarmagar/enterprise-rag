name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::815398003681:role/enterprise-rag-github
          aws-region: us-east-1
      - name: Update the instance
        run: |
          set -eu
          cat > /tmp/ssm.json <<'EOF'
          {"commands":["sudo -u ubuntu bash /opt/enterprise-rag/deploy/remote-update.sh"]}
          EOF
          command_id=$(aws ssm send-command \
            --instance-ids i-07a586aa1312f97c3 \
            --document-name AWS-RunShellScript \
            --timeout-seconds 1800 \
            --comment "deploy main" \
            --parameters file:///tmp/ssm.json \
            --query Command.CommandId --output text)
          echo "command=$command_id"
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id i-07a586aa1312f97c3 \
              --query Status --output text || true)
            echo "status=$status"
            case "$status" in
              Success) exit 0 ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id i-07a586aa1312f97c3 \
                  --query StandardErrorContent --output text || true
                exit 1
                ;;
            esac
            sleep 15
          done
          exit 1
