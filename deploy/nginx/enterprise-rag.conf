# Single public entry for chat UI, evals UI, and FastAPI.
# Install:
#   sudo cp deploy/nginx/enterprise-rag.conf /etc/nginx/sites-available/enterprise-rag
#   sudo ln -sf /etc/nginx/sites-available/enterprise-rag /etc/nginx/sites-enabled/enterprise-rag
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Public paths:
#   /        → Streamlit chat  (127.0.0.1:8501)
#   /evals/  → Streamlit evals (127.0.0.1:8502, baseUrlPath=evals)
#   /api/    → FastAPI         (127.0.0.1:8000)
#
# Open security group ports 80 (and 443 if you add TLS later).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream rag_api {
    server 127.0.0.1:8000;
}

upstream rag_chat {
    server 127.0.0.1:8501;
}

upstream rag_evals {
    server 127.0.0.1:8502;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50m;

    # FastAPI — strip /api prefix so existing routes (/health, /query, …) stay unchanged
    location /api/ {
        proxy_pass http://rag_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Evals Streamlit (must be registered before the catch-all /)
    location /evals/ {
        proxy_pass http://rag_evals/evals/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    location = /evals {
        return 301 /evals/;
    }

    # Chat Streamlit
    location / {
        proxy_pass http://rag_chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}
