# Local Docker nginx - proxies to services on the Windows/macOS host.
# Run:
#   docker run --rm -p 8080:80 -v "%CD%/deploy/nginx/enterprise-rag.local.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream rag_api {
    server host.docker.internal:8000;
}

upstream rag_chat {
    server host.docker.internal:8501;
}

upstream rag_evals {
    server host.docker.internal:8502;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://rag_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /evals/ {
        proxy_pass http://rag_evals/evals/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    location = /evals {
        return 301 /evals/;
    }

    location / {
        proxy_pass http://rag_chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}
